# Packages of the new Qt ViewTouch (modern/) for Fedora, Debian / Raspberry
# Pi OS and Ubuntu (x86_64 and aarch64) and Windows (x86_64). Run it from
# the Actions tab (the packages are attached to the run), or push a
# modern-v* tag: Modern release builds them and publishes the Debian 13
# and Windows ones.
name: Modern packages

on:
  workflow_dispatch:
  workflow_call:   # Modern release

jobs:
  package:
    name: ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: fedora, image: 'fedora:44',      arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: fedora, image: 'fedora:44',      arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: debian, image: 'debian:trixie',  arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: debian, image: 'debian:trixie',  arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: ubuntu, image: 'ubuntu:26.04',   arch: x86_64,  runner: ubuntu-24.04 }
          - { distro: ubuntu, image: 'ubuntu:26.04',   arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      # git before the checkout: without it the checkout is a download with no
      # history, and the packages were numbered build 0 (store computers saw
      # 0.9.0 as older than what they run and never updated).
      - name: Install git
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install git
          else
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates git
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit: the build number is their count

      - name: Install build tools
        run: modern/packaging/build-packages.sh deps

      - name: Build packages
        run: modern/packaging/build-packages.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vtmodern-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            modern/dist/*.deb
            modern/dist/*.rpm
          if-no-files-found: error

  package-windows:
    name: windows x86_64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit: the build number is their count

      # windows-2022 already has the WiX Toolset v3 CPack's WIX generator
      # needs, and OpenSSL (Win64 OpenSSL) for encrypted backups.
      - name: Find this runner's OpenSSL
        id: openssl
        shell: pwsh
        run: |
          $dir = (Get-Command openssl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source | Split-Path -Parent)
          if (-not $dir) { Write-Warning "No OpenSSL found: the package will have no encrypted-backup support." }
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Fetch Qt
        shell: pwsh
        run: modern\tools\get-qt.ps1 -Prefix C:\Qt\qt

      - name: Build the package
        shell: pwsh
        env:
          VTM_QT: C:\Qt\qt
          VTM_OPENSSL_DIR: ${{ steps.openssl.outputs.dir }}
        run: modern\packaging\build-windows-package.ps1 -QtDir $env:VTM_QT -OpenSslDir $env:VTM_OPENSSL_DIR

      - uses: actions/upload-artifact@v7
        with:
          name: vtmodern-windows-x86_64
          path: modern/dist/*.msi
          if-no-files-found: error

  # What stores go through: the version they run now (the one published on
  # modern-packages) upgraded to this build, back down again (what an update
  # that didn't start properly does), and up again; each serves the store.
  upgrade:
    name: Upgrade and downgrade (Debian 13)
    needs: package
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vtmodern-debian-x86_64
          path: new

      - name: Upgrade, downgrade, upgrade
        env:
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL -o old.deb "https://github.com/$REPO/releases/download/modern-packages/vtmodern-debian13-amd64.deb"
          new=$(ls new/vtmodern_*~debian13_amd64*.deb | head -1)
          sh modern/packaging/tests/upgrade-test.sh old.deb "$new"
